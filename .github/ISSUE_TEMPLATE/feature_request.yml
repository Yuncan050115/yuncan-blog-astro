name: Feature request
description: Suggest an improvement
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What can you not do today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What you would like
      description: Describe the behaviour you want, not the implementation.
    validations:
      required: true
  - type: textarea
    id: workarounds
    attributes:
      label: Workarounds you have already tried
